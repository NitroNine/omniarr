services:
  omniarr:
    build: .
    image: omniarr:latest
    container_name: omniarr
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      - PUID=99
      - PGID=100
      - UMASK=002
      - TZ=America/New_York
      # Optional: create the admin account on first start (otherwise the web UI asks you)
      # - OMNIARR_USERNAME=admin
      # - OMNIARR_PASSWORD=changeme
      # Set to true if you serve Omniarr over HTTPS (reverse proxy) so login cookies are HTTPS-only
      # - OMNIARR_SECURE_COOKIES=true
    volumes:
      - /mnt/user/appdata/omniarr:/config
      # One share containing both downloads and media lets imports use
      # instant hardlinks/moves (TRaSH recommended layout).
      - /mnt/user/data:/data
      # Built-in downloader's folder (optional; without it downloads go to /data/usenet)
      - /mnt/user/data/usenet:/downloads
