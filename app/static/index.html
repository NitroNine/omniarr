<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omniarr</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script>
  // apply the saved theme before first paint so the page never flashes the wrong colours
  try { var t = localStorage.getItem("omniarr-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header>
  <div class="brand"><img src="/static/icon.svg" alt=""> Omniarr</div>
  <nav>
    <a href="#/movies" data-tab="movies">Movies</a>
    <a href="#/series" data-tab="series">TV</a>
    <a href="#/discover" data-tab="discover">Streaming</a>
    <a href="#/add" data-tab="add">Add</a>
    <a href="#/import" data-tab="import">Import</a>
    <a href="#/activity" data-tab="activity">Activity</a>
    <a href="#/settings" data-tab="settings">Settings</a>
  </nav>
  <div class="theme-toggle" role="group" aria-label="Colour theme">
    <button data-theme-choice="system" title="Follow your device">Auto</button>
    <button data-theme-choice="light" title="Light mode">☀ Light</button>
    <button data-theme-choice="dark" title="Dark mode">☾ Dark</button>
  </div>
</header>
<div id="banner"></div>
<main id="view"></main>
<div id="modal" class="hidden"><div class="modal-body"></div></div>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
